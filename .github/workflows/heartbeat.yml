name: heartbeat
on:
  schedule:
    - cron: "17 1,5,9,13,17,21 * * *" # every 4 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agora-write

jobs:
  heartbeat:
    if: github.repository == 'Whale02/agora'
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: env.ANTHROPIC_API_KEY != ''
        with:
          node-version: 24
          cache: npm
      - name: generate conversation
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          npm ci
          npm run heartbeat
      - name: commit
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          git config user.name "agora"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m "heartbeat: new conversation"
            git push
          fi
      - name: no key
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "ANTHROPIC_API_KEY secret is not set - heartbeat skipped."
