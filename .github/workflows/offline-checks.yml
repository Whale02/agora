name: offline-checks
on:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "scripts/**"
      - "docs/data/passages/**"
      - "docs/data/philosophers.json"
      - "docs/data/topics.json"
      - "CLAUDE.md"
      - ".claude/skills/**"
      - ".github/workflows/offline-checks.yml"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'Whale02/agora'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: install dependencies
        run: npm ci
      - name: offline corpus and retrieval checks
        run: node engine/test-retrieve.mjs
      - name: publisher syntax check
        run: node --check scripts/publish-local.mjs
