<!--
THESIS: A plaza you walk into mid-conversation, not a chat product you prompt. The feed refuses
the app-card grid; conversations render as stone tablets at tables already occupied.
OWN-WORLD: Dark marble under brazier light, from the engineer handoff. Ground #0A0908 with a
warm grain, tablets #14110E edged #241F19, ink #EDE4D3, gold #C9A45C for every accent that
carries meaning, ember #D2743C reserved for heat, verdigris #7FA391 for the visitor's own
voice. Cormorant Garamond display, Marcellus lapidary wordmark, Source Serif 4 dialogue,
Noto Serif SC for the bilingual wayfinding, system sans chrome. Seat accents live in
philosophers.json tuned for limestone, so the stylesheet lifts each one onto black.
STORY: You overhear a disagreement between people smarter than you, take a side, and sit down.
SHELL: The stoa, a left colonnade that stays with you: wordmark, bilingual wayfinding, a lit
brazier at its foot. It becomes a top bar under 900px. Labels are paired as the handoff shows,
Chinese carved above small English support. The rest of the interface has a Chinese reading
too, chosen by a toggle at the foot of the stoa and remembered per reader; what a philosopher
or a visitor SAYS is shown as written and never machine-translated.
FIRST VIEWPORT: The stoa, one line of invitation, then the hottest table's live exchange
immediately readable; primary action is entering that conversation.
FORM: Brief-pinned world (project doc, Digital Agora); the concept roll never ran.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the
verdict, DESIGN.md, and every shipping raster carrying its provenance.
-->
